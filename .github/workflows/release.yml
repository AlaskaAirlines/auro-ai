name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out with the release bot's token so the version-bump commit
          # semantic-release pushes back to main is authored by the bot. The bot
          # is a member of auro-release-managers, which bypasses the main branch
          # ruleset — the default GITHUB_TOKEN cannot bypass it.
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # CS-BUILD-003: gate the publish path, not only the pull-request one.
      # Force-pushes, ruleset bypasses and direct-to-main flows skip the PR
      # gate entirely — and the release bot above is itself a documented
      # bypass — so a corpus that never passed CI could otherwise be
      # published. Both scripts are dependency-free, hence ahead of `npm ci`.
      - name: Validate coding standards
        run: node scripts/validate-standards.mjs
      - name: Test the coding-standards validator
        run: node scripts/validate-standards.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Release
        run: npx semantic-release
        env:
          # Same bot token for the GitHub API calls (create release/tag).
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
