name: Validate Release Token

# TEMPORARY — verifies secrets.GH_TOKEN is a valid token with push access to
# this repo. Its owner's team membership (auro-release-managers → ruleset bypass)
# is checked separately. Delete this workflow once validated.

on:
  workflow_dispatch:
  push:
    branches:
      - jbaker/semantic-release

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GH_TOKEN identity and repo permissions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is empty or not visible to this workflow"
            exit 1
          fi
          echo "Token owner: $(gh api user -q .login)"
          echo "Repo permissions for this token:"
          gh api repos/AlaskaAirlines/auro-ai -q '.permissions'
