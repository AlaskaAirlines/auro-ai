name: Check Copilot Prompts

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Regenerate Copilot prompt files
        run: node scripts/build-copilot-prompts.mjs
      - name: Fail if copilot/prompts is out of date
        run: |
          if ! git diff --exit-code -- copilot/prompts/; then
            echo "::error::copilot/prompts/ is out of date. Run 'npm run build:copilot' and commit the result."
            exit 1
          fi
