name: Check Copilot Prompts

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate coding standards
        run: node scripts/validate-standards.mjs
      - name: Test the coding-standards validator
        run: node scripts/validate-standards.test.mjs
      - name: Test the capture-standard section locator
        run: node scripts/capture-sections.test.mjs
      - name: Regenerate Copilot prompt files
        run: node scripts/build-copilot-prompts.mjs
      - name: Fail if copilot/prompts is out of date
        run: |
          # status (not diff) so new untracked files, e.g. a newly bundled skill script, also fail
          if [ -n "$(git status --porcelain -- copilot/prompts/)" ]; then
            git status --porcelain -- copilot/prompts/
            git diff -- copilot/prompts/
            echo "::error::copilot/prompts/ is out of date. Run 'npm run build:copilot' and commit the result."
            exit 1
          fi
      - name: Regenerate Copilot CLI agent files
        run: node scripts/build-copilot-agents.mjs
      - name: Fail if copilot/agents is out of date
        run: |
          # status (not diff) so new untracked files, e.g. a newly bundled skill script, also fail
          if [ -n "$(git status --porcelain -- copilot/agents/)" ]; then
            git status --porcelain -- copilot/agents/
            git diff -- copilot/agents/
            echo "::error::copilot/agents/ is out of date. Run 'npm run build:copilot:agents' and commit the result."
            exit 1
          fi
